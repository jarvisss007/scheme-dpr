# Worked example: highway food kiosk + toilet service at an NH-48 fuel station,
# Ranebennur taluk, Haveri district (rural, general category).
# Reproduces "Option A" of Ranebennur_Rest_Stop_Low_Cost.xlsx: total ₹19.89 lakh,
# PMEGP 25% rural general subsidy, 10% own contribution.
# Money in ₹ lakh unless the field says _rs.

name: Highway Food Kiosk and Toilet Service, NH-48 Ranebennur
idea: >
  A small highway food kiosk (meals, tea and snacks) run on space rented inside an
  existing NH-48 fuel station near Ranebennur. The fuel station builds the
  Humsafar-standard toilets; we run and clean them for a monthly fee. Customers are
  truckers, bus crews and car travellers. No liquor, pan or tobacco is sold.
language: en

activity:
  sector: service
  tags: [food_service, wayside_amenity, highway]
  new_unit: true
  nic_description: "56101 - Restaurants without bars"

location:
  state: Karnataka
  district: Haveri
  taluk: Ranebennur
  area: rural
  site_description: Leased space of about 650 sq ft inside an operating fuel station on NH-48 (Pune-Bengaluru).

applicant:
  categories: [general]
  # Unknown items are flagged "verify" in the scheme check, never assumed.
  age: null
  education: null
  udyam_registered: false
  prior_mudra_tarun_repaid: false

setup_cost:
  items:
    - {name: Site preparation and parking, amount: 0}
    - {name: Kitchen and seating shed (prefab), qty: 650, unit: sq ft, rate: 0.015, note: "PEB/prefab with flooring and wiring, ~₹1,500/sq ft"}
    - {name: Toilet block, qty: 0, unit: sq ft, rate: 0.022, note: "Built by the fuel station under the Humsafar policy; we only operate it"}
    - {name: Water and sewage, amount: 1.0}
    - {name: Power and solar, amount: 1.5}
    - {name: Kitchen equipment and furniture, amount: 4.0}
    - {name: "Signage, lighting, CCTV", amount: 1.0}
    - {name: Licences and approvals, amount: 0.5, note: "FSSAI, trade licence, panchayat, fire NOC"}
  contingency_pct: 0.05
  working_capital: 1.25

revenue:
  - {name: Meals, per_day: 120, price_rs: 150, cogs_pct: 0.40, primary: true, revenue_share: true}
  - {name: Tea and snacks, per_day: 300, price_rs: 30, cogs_pct: 0.50, revenue_share: true}
  - {name: Fee from fuel station for running its toilets, annual_lakh: 3.6}

costs:
  staff: {count: 10, monthly_lakh: 0.15, manager_monthly_lakh: 0}
  rent_annual_lakh: 0
  revenue_share_pct: 0.10
  electricity: {kwh_per_day: 120, rate_rs: 8.5}
  other:
    - {name: "Repairs, supplies, licences", amount: 3.0}
    - {name: Marketing, amount: 1.0}

finance:
  scheme: auto
  interest_rate: 0.11
  tenor_years: 5
  tax_rate: 0.15
  depreciation_years: 10

assumptions:
  ramp_year1: 0.60
  ramp_year2: 0.85
  growth_after_year3: 0.05
  inflation: 0.05
  days_per_year: 365
  min_dscr: 1.3

market_notes: >
  NH-48 is the main Pune-Bengaluru freight corridor and carries heavy truck and bus
  traffic past Ranebennur. Under MoRTH's Humsafar policy (Oct 2024) fuel stations on
  national highways must offer clean toilets and rest facilities, which is why the
  station owner will pay an operator to run them.
