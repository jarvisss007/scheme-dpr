  - {task: "Site agreement and licences (FSSAI, trade licence, local body NOC)", month: "2"}
  - {task: Loan sanction and first disbursement, month: "2-3"}
  - {task: "Civil work, equipment purchase and installation", month: "3-4"}
  - {task: "Staff hiring and training, trial run", month: "4"}
  - {task: Start of commercial operation, month: "5"}

documents_common:
  - Aadhaar card and PAN card of the promoter
  - Passport-size photographs
  - Proof of residence
  - Udyam registration certificate
  - Bank account statement (last six months)
  - Quotations for equipment and civil work
  - Site documents (lease / rent agreement or ownership papers)
  - Licences needed for the activity (e.g. FSSAI, trade licence)
  - This project report, signed

tmpl:
  description: >-
    {name}. {idea} The unit will be set up at {place}, in a {area} area, as a {sector} enterprise
    run by the promoter.
  market: >-
    {notes} The projections assume, at full operation, daily sales of {volumes} at the site in
    {place}. These volumes are the promoter's estimates and should be checked against a short
    on-site count of passing customers before the loan is sanctioned.
  market_no_notes: The promoter has not yet recorded market observations for this site.
  operations: >-
    The unit will offer {offer}. It will run every day with {staff} staff under the promoter's
    supervision. The set-up covers {items}. Raw materials will be bought locally on short credit
    or cash, stock will be kept to a few days' needs, and daily sales and cash will be recorded.
  risks:
    - {risk: Demand at the site is lower than planned., mitigation: Count passing customers before opening and keep opening stock small until sales settle.}
    - {risk: Key staff leave at short notice., mitigation: Train at least two people for each critical task and pay on time.}
    - {risk: Licence or approval delays hold up the start., mitigation: Apply for all licences in the first month and track them weekly.}
    - {risk: Input prices rise faster than selling prices., mitigation: Review prices every quarter and buy staples in bulk when prices are low.}

