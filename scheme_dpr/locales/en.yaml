# English strings. Every user-facing word in the DPR, workbook and CLI comes from
# here, so a translation only needs a matching file (see kn.yaml). Placeholders in
# {braces} are filled by code; keep them unchanged when translating.

yes_word: "Yes"

disclaimer:
  review_required: >-
    DRAFT FOR HUMAN REVIEW. This report was generated by software. A qualified person
    (the promoter's consultant, CA or resource person) must check every figure, assumption
    and statement before it is signed or submitted to any bank or government office.
  verify_schemes: >-
    Scheme eligibility, subsidy rates and caps are taken from public 2025-26 sources and change
    often. Verify them with the District Industries Centre (DIC), the implementing agency and
    the lending bank before applying.
  numbers: >-
    All figures are computed from the stated inputs by the financial model; ₹ amounts are in
    lakh (1 lakh = ₹1,00,000) unless stated.
  template_narrative: >-
    Some narrative sections were filled from standard templates. Rewrite them with
    project-specific detail before submission.

